<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Icon for Architecture Design.

       An isometric three-storey block: the same thing the 3D view draws, so the
       icon and the application agree about what this program is for. Detail is
       kept to the floor lines only — windows and a plot outline both vanish at
       16 px and turn the mark to mud, which is the size that matters most. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1f27"/>
      <stop offset="1" stop-color="#12161c"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#ground)"/>
  <rect x="4" y="4" width="504" height="504" rx="100" fill="none" stroke="#2c3540" stroke-width="8"/>

  <!-- Roof -->
  <path d="M256 76 L406 151 L256 226 L106 151 Z" fill="#7cc3f0"/>
  <!-- Right elevation, catching the light -->
  <path d="M406 151 L406 361 L256 436 L256 226 Z" fill="#4aa3df"/>
  <!-- Left elevation, in shade -->
  <path d="M106 151 L106 361 L256 436 L256 226 Z" fill="#2b6f9e"/>

  <!-- Floor lines: three storeys, which is what makes it a building and not a box -->
  <g stroke="#12161c" stroke-width="7" stroke-linecap="round" opacity="0.55">
    <path d="M406 221 L256 296"/>
    <path d="M406 291 L256 366"/>
    <path d="M106 221 L256 296"/>
    <path d="M106 291 L256 366"/>
  </g>
  <path d="M256 226 L256 436" stroke="#12161c" stroke-width="7" opacity="0.55"/>
</svg>
